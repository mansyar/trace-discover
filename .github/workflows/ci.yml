# CI — runs on every PR to master, every push to master, and on demand.
# Gates: Biome + tsc (`pnpm check`) -> Vitest with coverage (informational artifact) -> production build -> payload budget (`pnpm budget`) -> smoke (`dev/qa/qa-smoke.mjs` on the built app).
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Checks, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            dev/pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install dev tooling (frozen lockfile)
        working-directory: dev
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck (Biome + tsc)
        run: pnpm check

      - name: Pack data validation (pack:check)
        run: pnpm pack:check

      - name: Tests with coverage (Vitest)
        run: pnpm test --coverage

      - name: Production build (Vite)
        run: pnpm build

      - name: Payload budget (dist size guard)
        run: pnpm budget

      - name: Smoke (boot -> pre-1 -> success)
        run: |
          pnpm preview &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4173/index.html > /dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:4173/index.html > /dev/null || { echo "preview never came up"; exit 1; }
          node dev/qa/qa-smoke.mjs

      - name: Upload smoke failure artifacts
        # Best-effort only: artifact service hiccups must never redden a run.
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: smoke-failure
          path: dev/qa/out/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage artifact (informational)
        # Best-effort only: a flaky artifact service must never redden a run
        # (observed: transient 403 FinalizeArtifact on run 34919423243).
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
